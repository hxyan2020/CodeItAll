</head>
<body>
  <header class="site-header" id="header">
    <a class="brand" href="../index.html" aria-label="Code It All home">
      <img class="brand-logo" src="../assets/CodeItAll_Logo_HD_black-transparent.png" alt="Code It All" />
    </a>
    <ul class="nav" id="nav">
      <li><a href="../course/">Learn with AI</a></li>
      <li><a href="../dissect/">Dissect any website</a></li>
      <li><a href="../career/">Career booster</a></li>
      <li><a href="../profile/">Me</a></li>
    </ul>
  </header>

  <main class="profile-main">
    <section class="panel account-panel" style="margin-top:1.5rem;">
      <div class="panel-head">
        <h2>Reset your password</h2>
        <p id="resetLead">Choose a new password for your CodeItAll account.</p>
      </div>
      <form class="auth-form" id="resetForm">
        <label for="newPw">New password</label>
        <input id="newPw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8" />
        <label for="newPw2">Confirm new password</label>
        <input id="newPw2" type="password" autocomplete="new-password" placeholder="Repeat password" required minlength="8" />
        <button type="submit" class="btn-save" id="resetSubmit">Set new password</button>
      </form>
      <p class="auth-note" id="resetNote" role="status"></p>
      <p class="fine"><a href="../profile/">Back to sign in</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-copy">© 2026 CodeItAll</div>
  </footer>

  <script src="../shared/progress.js?v=8"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const token = new URLSearchParams(location.search).get("token") || "";
    const note = (msg, kind) => {
      const el = $("#resetNote");
      el.textContent = msg || "";
      el.className = "auth-note" + (kind ? " " + kind : "");
    };
    if (!token) {
      $("#resetForm").classList.add("hide");
      $("#resetLead").textContent = "This reset link is missing its token. Request a new link from the Me page.";
    }
    $("#resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = $("#newPw").value;
      const pw2 = $("#newPw2").value;
      if (pw !== pw2) {
        note("Passwords don't match — please retype them.", "err");
        return;
      }
      $("#resetSubmit").disabled = true;
      note("Updating your password…");
      try {
        await window.CIAProgress.resetPassword(token, pw);
        $("#resetForm").classList.add("hide");
        note("Password updated. You can now sign in with your new password.", "ok");
      } catch (err) {
        note(String(err.message || err), "err");
      } finally {
        $("#resetSubmit").disabled = false;
      }
    });
  </script>
  <script defer src="/shared/install-app.js?v=2"></script>
</body>
</html>
