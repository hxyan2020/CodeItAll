<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Code It All">
  <!-- Compact favicon mark: < Ë | >  (CODE shorthand) on black -->
  <rect width="64" height="64" rx="12" fill="#000000"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- C = < -->
    <path d="M22 18 L12 32 L22 46"/>
    <!-- O = Ë -->
    <circle cx="34" cy="32" r="8"/>
    <!-- D = | > -->
    <path d="M46 18 V46"/>
    <path d="M50 18 L58 32 L50 46"/>
  </g>
</svg>
